[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyaota"
version = "0.5.0"
description = "Python app for generating and grading exams."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Cameron F. Abrams" }]

dependencies = [
  "pyyaml",
  "pdf2image",
  "PyPDF2",
  "numpy",
  "opencv-python-headless",
  "pint",
  "scipy",
  "pandas",
  "Pillow",
  "python-docx",
  "qrcode[pil]",
]

[project.optional-dependencies]
interactive = [
  "matplotlib",
]
test = [
  "pytest",
]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "black",
]
docs = [
  "sphinx",
  "furo",
  "sphinx-autodoc-typehints",
  "myst-parser",
  "sphinx-copybutton",
]

[project.scripts]
pyaota = "pyaota.cli:main"

# --- BUILD CONFIG -------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/pyaota"]

[tool.hatch.build.targets.sdist]
include = [
  "src/pyaota/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.black]
line-length = 88
target-version = ["py310"]
